name: Run Python Script Demo

on:
  workflow_dispatch: # 保留網頁手動觸發按鈕
  push:
    branches: [ "main" ]

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      # 1. 下載儲存庫程式碼
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. 執行 Python 腳本抓取安平潮汐網頁
      - name: Execute main.py
        run: python main.py

      # 5. 將產生的 anping_tide.html 自動 Commit 並 Push 回 GitHub 專案
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add anping_tide.html
          git commit -m "Auto update Anping tide data [skip ci]" || exit 0
          git push

      - name: Execute main.py
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add anping_tide.html
          git commit -m "Auto update Anping tide HTML page [skip ci]" || exit 0
          git push
